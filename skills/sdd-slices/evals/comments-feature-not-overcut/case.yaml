name: comments-feature-not-overcut
expected_outcome: |
  Агент читает spec и ADR, показывает таблицу нарезки и останавливается, ожидая согласия человека. В нарезке не больше 5 slices вместе с 001: создание, правка, удаление, права и отказы комментариев — в одном slice; уведомления отделены по причине неготового ADR/инфраструктуры.
