schema_version: "1.1"
name: comments-feature-not-overcut
expected_outcome: |
  Агент читает spec и ADR, пишет план нарезки docs/comments/_work/plan.md, доводит его до «План без ошибок» в sdd-lint plan, показывает план человеку и останавливается на вопросе «Нарезка подходит?». В плане не больше 5 slices вместе с 001: создание, правка, удаление, права и отказы комментариев — в одном slice; уведомления отделены по Р1 из-за неготового ADR или доставки событий. Файлов slices до ответа человека нет.
context:
  scaffold_script: place-files.sh
