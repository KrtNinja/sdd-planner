name: handover-first-round
expected_outcome: |
  Агент создаёт docs/task-handover/brainstorming.md со статусом «идёт» и без решений человека, задаёт первый раунд вопросов с номерами и рекомендациями на конкретных персонажах, не спрашивает факты из README сервисов (роли, один исполнитель, события task.updated, история в audit), не предлагает выбрать технологию и останавливается в ожидании ответов. Записку продакта из запроса скрипт записывает в «Источники:», поэтому вопроса «Есть что передать, чтобы было проще?» нет, а требования из записки идут вопросами с рекомендацией по ней.
